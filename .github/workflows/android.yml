name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm ci

      - name: Typecheck & Tests
        run: |
          npm run typecheck
          npm test

      - name: Build web app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # BimCollab vorübergehend aus; zum Einschalten Repository-Variable VITE_BIMCOLLAB_ENABLED=true setzen
          VITE_BIMCOLLAB_ENABLED: ${{ vars.VITE_BIMCOLLAB_ENABLED || 'false' }}

      - name: Sync Capacitor
        run: npx cap sync android

      # ubuntu-latest ships the Android SDK (ANDROID_HOME); Gradle fetches missing platforms itself
      - name: Build debug APK
        working-directory: android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: BCF-OnSite-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
